<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وب‌سایت آرتین</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Tahoma, sans-serif;
        background: #0f172a;
        color: white;
        text-align: center;
      }

      header {
        padding: 25px;
        background: #1e293b;
      }

      header h1 {
        color: #38bdf8;
      }

      main {
        padding: 70px 20px;
      }

      main h2 {
        font-size: 32px;
      }

      main p {
        color: #cbd5e1;
        line-height: 2;
      }

      button {
        padding: 14px 28px;
        background: #38bdf8;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #0ea5e9;
      }

      footer {
        padding: 20px;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>وب‌سایت آرتین</h1>
      <p>دنیای برنامه‌نویسی من</p>
    </header>

    <main>
      <h2>به سایت من خوش آمدی!</h2>

      <p>
        من آرتین هستم و دارم برنامه‌نویسی یاد می‌گیرم. این اولین سایت من است.
      </p>

      <button onclick="alert('سلام آرتین! سایتت اجرا شد 🎉')">کلیک کن!</button>
    </main>

    <footer>ساخته‌شده با علاقه به برنامه‌نویسی ❤️</footer>
  </body>
</html>
